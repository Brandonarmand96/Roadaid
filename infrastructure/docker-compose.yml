version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: roadaid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: roadaid
      POSTGRES_PASSWORD: roadaid
      POSTGRES_DB: roadaid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadaid -d roadaid"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: roadaid-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
