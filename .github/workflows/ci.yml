name: RoadAid CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test-build:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: roadaid
          POSTGRES_PASSWORD: roadaid
          POSTGRES_DB: roadaid
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build shared package
        run: pnpm --filter @roadaid/shared build

      - name: Run Prisma generate
        run: pnpm --filter api prisma:generate
        env:
          DATABASE_URL: postgresql://roadaid:roadaid@localhost:5432/roadaid?schema=public

      - name: Run database migrations
        run: pnpm --filter api db:migrate
        env:
          DATABASE_URL: postgresql://roadaid:roadaid@localhost:5432/roadaid?schema=public

      - name: Seed database
        run: pnpm --filter api db:seed
        env:
          DATABASE_URL: postgresql://roadaid:roadaid@localhost:5432/roadaid?schema=public
          JWT_ACCESS_SECRET: development_jwt_access_secret_key_minimum_32_characters_long_for_security
          JWT_REFRESH_SECRET: development_jwt_refresh_secret_key_minimum_32_characters_long_for_security
          ADMIN_BOOTSTRAP_EMAIL: admin@roadaid.co
          ADMIN_BOOTSTRAP_PASSWORD: AdminSecurePassword2026!

      - name: Run unit & integration tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://roadaid:roadaid@localhost:5432/roadaid?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: development_jwt_access_secret_key_minimum_32_characters_long_for_security
          JWT_REFRESH_SECRET: development_jwt_refresh_secret_key_minimum_32_characters_long_for_security

      - name: Build all apps
        run: pnpm build
