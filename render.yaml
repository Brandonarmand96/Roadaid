services:
  - type: web
    name: roadaid-test-api
    runtime: docker
    plan: free
    branch: test
    dockerfilePath: ./infrastructure/docker/Dockerfile.api
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: test
      - key: APP_TZ
        value: Africa/Lagos
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PUBLIC_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OTP_DEV_FIXED_CODE
        sync: false
      - key: SMS_PROVIDER
        value: console
      - key: MAPS_PROVIDER
        value: mapbox
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: PAYMENT_GATEWAY
        value: paystack
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: provider-documents
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false

  - type: web
    name: roadaid-test-admin
    runtime: node
    plan: free
    branch: test
    buildCommand: corepack enable && corepack prepare pnpm@12.18.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @roadaid/shared build && pnpm --filter admin-web build
    startCommand: pnpm --filter admin-web exec next start -p $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN
        sync: false
